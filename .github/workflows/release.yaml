# Release automation for datafusion-table-providers.
#
# Required repository secrets:
#   RELEASE_TOKEN - Admin-capable PAT that can push to protected main and create releases
#
# Required crates.io trusted publishing config for EACH published crate
# (configure under each crate's settings → trusted publishing on crates.io):
#   Repository:     datafusion-contrib/datafusion-table-providers
#   Workflow file:  release.yaml
#   Environment:    crates-io
#
# Crates published by this workflow:
#   datafusion-table-providers-common
#   datafusion-table-providers-odbc
#   datafusion-table-providers-clickhouse
#   datafusion-table-providers-flightsql
#   datafusion-table-providers-mongodb
#   datafusion-table-providers-mysql
#   datafusion-table-providers-sqlite
#   datafusion-table-providers-postgres
#   datafusion-table-providers-duckdb
#   datafusion-table-providers-adbc
#   datafusion-table-providers (facade)
#
# Also create a GitHub Environment named "crates-io" (Settings → Environments).
#
# Publishing is staged across parallel jobs so that each job fetches its own
# fresh crates.io trusted-publishing token (a single long-lived token can
# expire mid-publish and take the whole run down with it):
#   1. release          - validate, bump, commit, push, create GitHub release
#   2. publish-common   - publish the common crate
#   3. publish-provider - publish each of the 9 provider crates (in parallel)
#   4. publish-facade   - publish the facade crate (needs all providers)
#
# Each publish step skips a crate whose exact version is already on crates.io,
# so a re-run after a partial failure resumes where it left off.
#
# Trigger via Actions → Release → Run workflow, providing the new version (e.g. 0.13.0 or v0.13.0).

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.13.0 or v0.13.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: crates-io
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Normalize and validate version
        id: version
        run: |
          raw="${{ inputs.version }}"
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: '$raw' (expected X.Y.Z or vX.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Bump workspace version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 <<'PY'
          import pathlib
          import re
          import os

          version = os.environ["VERSION"]
          cargo_toml = pathlib.Path("Cargo.toml")
          text = cargo_toml.read_text()

          def bump_workspace_package_version(contents: str, new_version: str) -> str:
              lines = contents.splitlines(keepends=True)
              in_workspace_package = False
              replaced = False
              out = []
              for line in lines:
                  if line.startswith("[") and line.strip().endswith("]"):
                      in_workspace_package = line.strip() == "[workspace.package]"
                  if in_workspace_package and re.match(r'^version\s*=\s*"', line):
                      out.append(f'version = "{new_version}"\n')
                      replaced = True
                      in_workspace_package = False
                      continue
                  out.append(line)
              if not replaced:
                  raise SystemExit("Failed to find [workspace.package] version in Cargo.toml")
              return "".join(out)

          cargo_toml.write_text(bump_workspace_package_version(text, version))

          # Keep path+version workspace deps in sync for crates.io publish.
          workspace_crate_names = (
              "datafusion-table-providers",
              "datafusion-table-providers-common",
              "datafusion-table-providers-odbc",
              "datafusion-table-providers-clickhouse",
              "datafusion-table-providers-flightsql",
              "datafusion-table-providers-mongodb",
              "datafusion-table-providers-mysql",
              "datafusion-table-providers-sqlite",
              "datafusion-table-providers-postgres",
              "datafusion-table-providers-duckdb",
              "datafusion-table-providers-adbc",
              "datafusion-table-providers-oracle",
          )
          cargo_text = cargo_toml.read_text()
          for name in workspace_crate_names:
              pattern = (
                  rf'(?m)^({re.escape(name)}\s*=\s*\{{\s*version\s*=\s*")[^"]+(")'
              )
              cargo_text, count = re.subn(pattern, rf"\g<1>{version}\g<2>", cargo_text, count=1)
              if count != 1:
                  raise SystemExit(
                      f"Failed to update workspace.dependencies version for {name} in Cargo.toml"
                  )
          cargo_toml.write_text(cargo_text)

          lock = pathlib.Path("Cargo.lock")
          lock_text = lock.read_text()
          for name in (
              *workspace_crate_names,
              "datafusion-table-providers-python",
          ):
              pattern = (
                  rf'(?m)(^\[\[package\]\]\nname = "{re.escape(name)}"\nversion = ")[^"]+(")'
              )
              lock_text, count = re.subn(pattern, rf"\g<1>{version}\g<2>", lock_text, count=1)
              if count != 1:
                  raise SystemExit(f"Failed to update version for {name} in Cargo.lock")
          lock.write_text(lock_text)
          PY

      - name: Commit and push version bump
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --staged --quiet; then
            echo "No version changes to commit (already at ${TAG}?) — skipping"
            exit 0
          fi
          git commit -m "${TAG}"
          git push origin HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping"
            exit 0
          fi
          gh release create "${TAG}" \
            --target main \
            --title "${TAG}" \
            --generate-notes

  # Shared shape for every publish job: check out the version-bumped main, set
  # up the toolchain, fetch a FRESH crates.io trusted-publishing token, and
  # publish a single crate (skipping it if that exact version is already out).
  # The fresh per-job token is what keeps a long publish from tripping over an
  # expired token.

  publish-common:
    name: Publish common
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          crate="datafusion-table-providers-common"
          version="${{ needs.release.outputs.version }}"
          if curl -fsS -H "User-Agent: dftp-release-workflow" \
               "https://crates.io/api/v1/crates/${crate}/versions?per_page=100" 2>/dev/null \
               | python3 -c "import sys,json; nums=[v['num'] for v in json.load(sys.stdin).get('versions',[])]; sys.exit(0 if '${version}' in nums else 1)" 2>/dev/null; then
            echo "${crate} ${version} already on crates.io — skipping"
            exit 0
          fi
          echo "Publishing ${crate} ${version} to crates.io"
          cargo publish -p "${crate}"

  publish-provider:
    name: Publish provider
    needs:
      - release
      - publish-common
    runs-on: ubuntu-latest
    environment: crates-io
    strategy:
      fail-fast: false
      matrix:
        crate:
          - odbc
          - clickhouse
          - flightsql
          - mongodb
          - mysql
          - sqlite
          - postgres
          - duckdb
          - adbc
          - oracle
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          crate="datafusion-table-providers-${{ matrix.crate }}"
          version="${{ needs.release.outputs.version }}"
          if curl -fsS -H "User-Agent: dftp-release-workflow" \
               "https://crates.io/api/v1/crates/${crate}/versions?per_page=100" 2>/dev/null \
               | python3 -c "import sys,json; nums=[v['num'] for v in json.load(sys.stdin).get('versions',[])]; sys.exit(0 if '${version}' in nums else 1)" 2>/dev/null; then
            echo "${crate} ${version} already on crates.io — skipping"
            exit 0
          fi
          echo "Publishing ${crate} ${version} to crates.io"
          cargo publish -p "${crate}"

  publish-facade:
    name: Publish facade
    needs:
      - release
      - publish-provider
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          crate="datafusion-table-providers"
          version="${{ needs.release.outputs.version }}"
          if curl -fsS -H "User-Agent: dftp-release-workflow" \
               "https://crates.io/api/v1/crates/${crate}/versions?per_page=100" 2>/dev/null \
               | python3 -c "import sys,json; nums=[v['num'] for v in json.load(sys.stdin).get('versions',[])]; sys.exit(0 if '${version}' in nums else 1)" 2>/dev/null; then
            echo "${crate} ${version} already on crates.io — skipping"
            exit 0
          fi
          echo "Publishing ${crate} ${version} to crates.io"
          cargo publish -p "${crate}"
