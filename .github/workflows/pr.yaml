---
name: pr

on:
  pull_request:
    branches:
      - main
      - spiceai


jobs:
  lint:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-features -- -D warnings

  build:
    name: Build (facade all-features)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ODBC
        run: sudo apt-get install -y unixodbc-dev

      - name: Check facade with all features
        run: cargo check -p datafusion-table-providers --all-features

  leaf-crates:
    name: Leaf (${{ matrix.crate }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        crate:
          - datafusion-table-providers-common
          - datafusion-table-providers-adbc
          - datafusion-table-providers-clickhouse
          - datafusion-table-providers-duckdb
          - datafusion-table-providers-flightsql
          - datafusion-table-providers-mongodb
          - datafusion-table-providers-mysql
          - datafusion-table-providers-odbc
          - datafusion-table-providers-oracle
          - datafusion-table-providers-postgres
          - datafusion-table-providers-sqlite

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ODBC
        if: matrix.crate == 'datafusion-table-providers-odbc'
        run: sudo apt-get install -y unixodbc-dev

      - name: Check ${{ matrix.crate }}
        run: cargo check -p ${{ matrix.crate }}

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ODBC & Sqlite
        run: |
          sudo apt-get install -y unixodbc-dev libsqlite3-dev

      - name: Run unit tests
        run: make test

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Official Postgres image — CNPG variants can exceed the healthcheck window in CI.
      PG_DOCKER_IMAGE: postgres:16
      MYSQL_DOCKER_IMAGE: mysql:8.0
      CLICKHOUSE_DOCKER_IMAGE: clickhouse/clickhouse-server:24.8
      # Keep integration test logs concise for faster CI runs.
      RUST_LOG: info
      # Serialize Docker-backed tests a bit to avoid stampeding many Postgres containers.
      RUST_TEST_THREADS: "4"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # Free space before pulling images so we do not delete the images we need.
      - name: Free Disk Space
        run: |
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          df -h

      - name: Cache Docker images
        id: docker-cache
        uses: actions/cache@v6
        with:
          path: /tmp/docker-images
          key: docker-images-${{ env.PG_DOCKER_IMAGE }}-${{ env.MYSQL_DOCKER_IMAGE }}-${{ env.CLICKHOUSE_DOCKER_IMAGE }}

      - name: Load or pull Docker images
        run: |
          mkdir -p /tmp/docker-images
          load_or_pull() {
            local name="$1"
            local image="$2"
            local tar="/tmp/docker-images/${name}.tar"
            if [ -f "$tar" ]; then
              echo "Loading cached $image..."
              docker load -i "$tar"
            else
              echo "Pulling $image..."
              docker pull "$image"
              docker save -o "$tar" "$image"
            fi
          }
          load_or_pull postgres "${{ env.PG_DOCKER_IMAGE }}"
          load_or_pull mysql "${{ env.MYSQL_DOCKER_IMAGE }}"
          load_or_pull clickhouse "${{ env.CLICKHOUSE_DOCKER_IMAGE }}"

      - name: Install ODBC & Sqlite
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev libsqlite3-dev

      - name: Install ADBC drivers
        run: |
          curl -LsSf https://dbc.columnar.tech/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          dbc install sqlite
          dbc install duckdb
          ls -la "${XDG_CONFIG_HOME:-$HOME/.config}/adbc/drivers" || true

      - name: Run integration tests
        run: make test-integration

  oracle-integration-test:
    name: Oracle Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ORACLE_DOCKER_IMAGE: docker.io/gvenzl/oracle-free:latest
      RUST_LOG: info

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Oracle Instant Client
        run: |
          # `rust-oracle` uses ODPI-C and dlopens the Instant Client at runtime.
          sudo apt-get update
          sudo apt-get install -y libaio1t64 wget unzip || sudo apt-get install -y libaio1 wget unzip
          wget -q https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          mkdir -p /opt/oracle
          unzip -q instantclient-basiclite-linuxx64.zip -d /opt/oracle -x "META-INF/*"
          IC_DIR=$(ls -d /opt/oracle/instantclient*)
          # Ubuntu 22.04+ renamed libaio.so.1 to libaio.so.1t64; the Instant Client still looks for the old name.
          if [ -f /usr/lib/x86_64-linux-gnu/libaio.so.1t64 ] && [ ! -f "$IC_DIR/libaio.so.1" ]; then
            sudo ln -s /usr/lib/x86_64-linux-gnu/libaio.so.1t64 "$IC_DIR/libaio.so.1"
          fi
          echo "LD_LIBRARY_PATH=$IC_DIR" >> "$GITHUB_ENV"

      - name: Cache Oracle Docker image
        id: oracle-docker-cache
        uses: actions/cache@v6
        with:
          path: /tmp/oracle-image
          key: oracle-image-${{ env.ORACLE_DOCKER_IMAGE }}

      - name: Load or pull Oracle image
        run: |
          mkdir -p /tmp/oracle-image
          if [ -f /tmp/oracle-image/oracle.tar ]; then
            docker load -i /tmp/oracle-image/oracle.tar
          else
            docker pull "${ORACLE_DOCKER_IMAGE}"
            docker save -o /tmp/oracle-image/oracle.tar "${ORACLE_DOCKER_IMAGE}"
          fi

      # Build the test binary first so the Rust compile does not eat into the
      # Oracle container's boot/health window below or the job timeout.
      - name: Build integration test binary
        run: cargo build --tests -p datafusion-table-providers --no-default-features --features oracle

      - name: Start Oracle container
        run: |
          docker run -d --name oracle-it \
            -e ORACLE_PASSWORD=password \
            -p 1521:1521 \
            "${ORACLE_DOCKER_IMAGE}"
          echo "Waiting for Oracle to become ready (cold boot can take ~10 minutes on CI runners)..."
          # gvenzl/oracle-free ships no Docker HEALTHCHECK, so readiness is
          # detected via the image's own "DATABASE IS READY TO USE!" marker
          # plus a successful TCP probe of the published listener port.
          for i in $(seq 1 360); do
            if docker logs oracle-it 2>&1 | grep -q "DATABASE IS READY TO USE!" \
               && (exec 3<>/dev/tcp/127.0.0.1/1521) 2>/dev/null; then
              echo "Oracle listener is up on 1521"
              exit 0
            fi
            if docker inspect --format '{{.State.Status}}' oracle-it | grep -q exited; then
              docker logs oracle-it
              exit 1
            fi
            sleep 5
          done
          echo "Oracle never became ready" >&2
          docker logs oracle-it >&2 || true
          exit 1

      - name: Run Oracle integration tests
        run: cargo test -p datafusion-table-providers --test integration --no-default-features --features oracle -- --test-threads=1 --nocapture

  python-integration-test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            python/pyproject.toml
            python/uv.lock

      - name: Install ODBC, Sqlite and Roapi
        run: |
          sudo apt-get install -y unixodbc-dev libsqliteodbc libsqlite3-dev
          # 0.13.0 musl release panics on HTTP UI route registration; 0.12.7 is fine.
          curl -fsSL -o /tmp/roapi.tar.gz \
            https://github.com/roapi/roapi/releases/download/roapi-v0.12.7/roapi-x86_64-unknown-linux-musl.tar.gz
          sudo tar -xzf /tmp/roapi.tar.gz -C /usr/local/bin roapi
          sudo chmod +x /usr/local/bin/roapi
          roapi --help >/dev/null

      - name: Build Python package and run tests
        working-directory: python
        run: |
          uv sync --dev --no-install-project --no-install-package datafusion
          uv run --no-project maturin develop --uv
          uv run --no-project pytest -v python/tests
