[package]
name = "datafusion-table-providers-common"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "Shared infrastructure for DataFusion table providers"

[dependencies]
arrow = { workspace = true, features = ["ffi"] }
arrow60 = { package = "arrow", version = "60", default-features = false, features = ["ffi"], optional = true }
async-trait = { workspace = true }
bigdecimal = { workspace = true }
chrono = { workspace = true }
datafusion = { workspace = true, default-features = false, features = ["sql"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
dashmap = "6.1"
futures = { workspace = true }
itertools = { workspace = true }
num-bigint = { workspace = true }
sea-query = { workspace = true, features = [
  "backend-sqlite",
  "backend-postgres",
  "postgres-array",
  "with-rust_decimal",
  "with-bigdecimal",
  "with-time",
  "with-chrono",
] }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs"] }
tracing = { workspace = true }
hickory-resolver = "0.26"
url = { workspace = true }

[features]
default = ["federation"]
federation = ["dep:datafusion-federation"]
# Conversions between arrow 60 and the arrow version used by DataFusion,
# for drivers that are built against arrow 60.
arrow60 = ["dep:arrow60"]

[dev-dependencies]
datafusion = { workspace = true, default-features = false, features = ["parquet", "sql"] }
reqwest = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
