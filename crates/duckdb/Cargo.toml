[package]
name = "datafusion-table-providers-duckdb"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "DataFusion duckdb table provider"

[dependencies]
arrow = { workspace = true }
arrow-schema = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
byte-unit = "5.2"
datafusion = { workspace = true, default-features = false, features = ["sql"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
datafusion-table-providers-common = { workspace = true, features = ["arrow60"] }
duckdb = { workspace = true, features = ["bundled", "r2d2", "vtab", "vtab-arrow", "appender-arrow"] }
dyn-clone = "1.0"
futures = { workspace = true }
itertools = { workspace = true }
r2d2 = { workspace = true }
rand = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs"] }
tracing = { workspace = true }

[features]
default = ["federation"]
federation = ["dep:datafusion-federation", "datafusion-table-providers-common/federation"]

[dev-dependencies]
datafusion = { workspace = true, default-features = false, features = ["parquet", "sql"] }
reqwest = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
