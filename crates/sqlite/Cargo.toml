[package]
name = "datafusion-table-providers-sqlite"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "DataFusion sqlite table provider"

[dependencies]
arrow = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
datafusion = { workspace = true, default-features = false, features = ["sql"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
datafusion-table-providers-common = { workspace = true }
fundu = "2.0"
futures = { workspace = true }
rusqlite = { version = "0.37" }
sea-query = { workspace = true, features = ["backend-sqlite", "with-rust_decimal", "with-bigdecimal", "with-time", "with-chrono"] }
snafu = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs"] }
tokio-rusqlite = "0.7"
tracing = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
rstest = { workspace = true }

[features]
default = ["federation", "bundled"]
federation = ["dep:datafusion-federation", "datafusion-table-providers-common/federation"]
bundled = ["rusqlite/bundled"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
