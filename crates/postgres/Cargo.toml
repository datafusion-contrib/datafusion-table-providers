[package]
name = "datafusion-table-providers-postgres"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "DataFusion postgres table provider"

[dependencies]
arrow = { workspace = true }
arrow-json = { workspace = true }
arrow-schema = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bb8 = { workspace = true }
bb8-postgres = "0.9"
bigdecimal = { workspace = true }
byteorder = "1.5"
chrono = { workspace = true }
datafusion = { workspace = true, default-features = false, features = ["sql"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
datafusion-table-providers-common = { workspace = true }
fallible-iterator = "0.3"
futures = { workspace = true }
geo-types = "0.7"
logos = "0.16"
native-tls = "0.2"
pem = "4.0"
postgres-native-tls = "0.5.0"
rust_decimal = { workspace = true, features = ["db-postgres"] }
sea-query = { workspace = true, features = ["backend-postgres", "postgres-array", "with-rust_decimal", "with-bigdecimal", "with-time", "with-chrono"] }
secrecy = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1", "with-geo-types-0_7"] }
tracing = { workspace = true }
uuid = { version = "1.18" }

[features]
default = ["federation"]
federation = ["dep:datafusion-federation", "datafusion-table-providers-common/federation"]

[dev-dependencies]
geozero = { version = "0.15.1", features = ["with-wkb"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
