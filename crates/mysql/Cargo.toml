[package]
name = "datafusion-table-providers-mysql"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "DataFusion mysql table provider"

[dependencies]
arrow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bigdecimal = { workspace = true }
chrono = { workspace = true }
datafusion = { workspace = true, default-features = false, features = ["sql"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
datafusion-table-providers-common = { workspace = true }
futures = { workspace = true }
mysql_async = { version = "0.37", features = ["native-tls-tls", "chrono", "time", "bigdecimal"] }
num-bigint = { workspace = true }
sea-query = { workspace = true, features = ["backend-mysql", "with-rust_decimal", "with-bigdecimal", "with-time", "with-chrono"] }
secrecy = { workspace = true }
snafu = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[features]
default = ["federation"]
federation = ["dep:datafusion-federation", "datafusion-table-providers-common/federation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
