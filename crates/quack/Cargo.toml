[package]
name = "datafusion-table-providers-quack"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "DataFusion table provider for remote DuckDB over the Quack protocol"

[dependencies]
arrow = { workspace = true }
async-trait = "0.1"
datafusion = { workspace = true, default-features = false, features = ["sql"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
datafusion-table-providers-common = { workspace = true }
futures = "0.3"
quack_protocol = { git = "https://github.com/bnjjj/quack_protocol_rs", rev = "2150f35", features = ["arrow"] }
secrecy = "0.10"
snafu = "0.9"
tokio = { version = "1.52", features = ["macros", "time", "rt-multi-thread"] }
tracing = "0.1"

[features]
default = ["federation"]
federation = ["dep:datafusion-federation", "datafusion-table-providers-common/federation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
