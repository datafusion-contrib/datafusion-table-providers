[package]
name = "datafusion-table-providers-adbc"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "DataFusion adbc table provider"

[dependencies]
arrow = { workspace = true }
arrow-schema = { workspace = true }
adbc_core = { workspace = true }
adbc_driver_manager = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
datafusion = { workspace = true, default-features = false, features = ["sql"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
datafusion-table-providers-common = { workspace = true }
futures = { workspace = true }
r2d2 = { workspace = true }
r2d2_adbc = "0.3.0"
snafu = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs"] }
tracing = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }

[features]
default = ["federation"]
federation = ["dep:datafusion-federation", "datafusion-table-providers-common/federation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
