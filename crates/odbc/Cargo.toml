[package]
name = "datafusion-table-providers-odbc"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "DataFusion odbc table provider"

[dependencies]
arrow-odbc = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
datafusion = { workspace = true, default-features = false, features = ["sql"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
datafusion-table-providers-common = { workspace = true }
dyn-clone = "1.0"
futures = { workspace = true }
odbc-api = "29.0"
snafu = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs"] }
tracing = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }

[features]
default = ["federation"]
federation = ["dep:datafusion-federation", "datafusion-table-providers-common/federation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
