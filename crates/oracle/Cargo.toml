[package]
name = "datafusion-table-providers-oracle"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "DataFusion oracle table provider"

[dependencies]
arrow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
bb8 = { workspace = true }
bb8-oracle = { version = "0.3", features = ["chrono"] }
bigdecimal = { workspace = true }
chrono = { workspace = true }
datafusion = { workspace = true, default-features = false, features = ["sql"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
datafusion-table-providers-common = { workspace = true }
futures = { workspace = true }
num-bigint = { workspace = true }
oracle = { workspace = true, features = ["chrono"] }
secrecy = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true, features = ["macros", "fs", "rt-multi-thread"] }
tracing = { workspace = true }

[features]
default = ["federation"]
federation = ["dep:datafusion-federation", "datafusion-table-providers-common/federation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
