[package]
name = "datafusion-table-providers-clickhouse"
version = { workspace = true }
readme = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
description = "DataFusion clickhouse table provider"

[dependencies]
arrow = { workspace = true }
arrow-ipc = { workspace = true, features = ["lz4"] }
async-stream = { workspace = true }
async-trait = { workspace = true }
clickhouse = { workspace = true }
datafusion = { workspace = true, default-features = false, features = ["sql"] }
datafusion-federation = { workspace = true, features = ["sql"], optional = true }
datafusion-table-providers-common = { workspace = true }
futures = { workspace = true }
regex = "1"
serde = { workspace = true }
snafu = { workspace = true }
secrecy = { workspace = true }
url = { workspace = true }

[features]
default = ["federation"]
federation = ["dep:datafusion-federation", "datafusion-table-providers-common/federation"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
