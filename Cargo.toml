[workspace]
members = ["core", "crates/common", "python", "crates/odbc", "crates/clickhouse", "crates/flightsql", "crates/mongodb", "crates/mysql", "crates/sqlite", "crates/postgres", "crates/duckdb", "crates/adbc", "crates/oracle"]
resolver = "2"

[workspace.package]
version = "0.14.0"
readme = "README.md"
edition = "2021"
repository = "https://github.com/datafusion-contrib/datafusion-table-providers"
license = "Apache-2.0"
description = "Extend the capabilities of DataFusion to support additional data sources via implementations of the `TableProvider` trait."

[workspace.dependencies]
adbc_core = { version = "0.25" }
adbc_driver_manager = { version = "0.25" }
arrow = "59.2"
arrow-array = { version = "59.2" }
arrow-flight = { version = "59.2", features = [
    "flight-sql-experimental",
    "tls-ring",
] }
arrow-ipc = { version = "59.2" }
arrow-schema = { version = "59.2", features = ["serde"] }
arrow-json = "59.2"
arrow-odbc = { version = "25.3" }
async-stream = { version = "0.3" }
async-trait = { version = "0.1" }
bb8 = { version = "0.9" }
bigdecimal = { version = "0.4" }
chrono = { version = "0.4.44" }
clickhouse = { version = "0.15" }
datafusion = { version = "55.2", default-features = false }
datafusion-expr = { version = "55.2" }
datafusion-federation = { version = "0.5.7" }
datafusion-ffi = { version = "55.2" }
datafusion-proto = { version = "55.2" }
datafusion-physical-expr = { version = "55.2" }
datafusion-physical-plan = { version = "55.2" }
datafusion-table-providers = { version = "0.14.0", path = "core" }
datafusion-table-providers-common = { version = "0.14.0", path = "crates/common" }
datafusion-table-providers-odbc = { version = "0.14.0", path = "crates/odbc" }
datafusion-table-providers-clickhouse = { version = "0.14.0", path = "crates/clickhouse" }
datafusion-table-providers-flightsql = { version = "0.14.0", path = "crates/flightsql" }
datafusion-table-providers-mongodb = { version = "0.14.0", path = "crates/mongodb" }
datafusion-table-providers-mysql = { version = "0.14.0", path = "crates/mysql" }
datafusion-table-providers-sqlite = { version = "0.14.0", path = "crates/sqlite" }
datafusion-table-providers-postgres = { version = "0.14.0", path = "crates/postgres" }
datafusion-table-providers-duckdb = { version = "0.14.0", path = "crates/duckdb" }
datafusion-table-providers-adbc = { version = "0.14.0", path = "crates/adbc" }
datafusion-table-providers-oracle = { version = "0.14.0", path = "crates/oracle" }
duckdb = { version = "1.20000.0" }
futures = { version = "0.3" }
itertools = { version =  "0.15" }
mongodb = { version = "3.6.0", features = ["openssl-tls"] }
oracle = { version = "0.6", features = ["chrono"] }
num-bigint = { version = "0.4" }
r2d2 = { version = "0.8"}
rand = { version = "0.10" }
reqwest = { version = "0.13" }
rstest = { version = "0.28" }
rust_decimal = {version = "1.38"}
sea-query = { version = "1.0.0" }
secrecy = { version = "0.10" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sha2 = { version = "0.11" }
snafu = { version = "0.9" }
tempfile = { version = "3.27.0" }
time = { version = "0.3" }
tokio = { version = "1" }
tonic = { version = "0.14", features = ["tls-native-roots", "tls-webpki-roots"] }
tracing = { version = "0.1"}
url = { version = "2.5" }

[workspace.metadata.cargo-machete]
ignored = ["datafusion-federation"]
